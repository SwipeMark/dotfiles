# ~/.aerospace.toml

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
# Terminal
alt-enter = '''exec-and-forget osascript -e '
tell application "kitty"
    do script ""
        activate
    end tell'
'''

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-d = 'workspace D'  # Discord
alt-e = 'workspace E'  # Editor ex.Neovide
alt-i = 'workspace I'  # ex.Illustrator, Affinity
alt-m = 'workspace M'  # Music
alt-n = 'workspace N'  # Notion
alt-o = 'workspace O'  # Office
alt-t = 'workspace T'  # Term ex.Kitty

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

alt-shift-c = 'reload-config'

alt-r = 'mode resize'

# : I'l do it lator

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'

[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = ['layout floating']

[[on-window-detected]]
    if.app-name-regex-substring = 'Neovide'
    run = ['move-node-to-workspace E']

[[on-window-detected]]
    if.app-id = 'com.apple.Music'
    run = ['move-node-to-workspace M']

[[on-window-detected]]
    if.app-id = 'com.adobe.illustrator'
    run = ['move-node-to-workspace I']

[[on-window-detected]]
    if.app-id = 'com.canva.affinity'
    run = ['move-node-to-workspace I']

[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.kitty'
    run = ['move-node-to-workspace T']

[[on-window-detected]]
    if.app-id = 'com.microsoft.Excel'
    run = ['move-node-to-workspace O']

[[on-window-detected]]
    if.app-id = 'notion.id'
    if.app-name-regex-substring = 'Notion'
    run = ['move-node-to-workspace N']

[[on-window-detected]]
    if.app-id = 'com.1password.1password'
    if.app-name-regex-substring = '1Password'
    run = ['layout floating']
